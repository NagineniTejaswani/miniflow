name: real-containers
jobs:
  prepare:
    image: alpine:3.20
    command: ["sh", "-c", "echo preparing && sleep 1"]
  test_a:
    needs: [prepare]
    image: python:3.12-slim
    command: ["python", "-c", "print('Test A passed')"]
  test_b:
    needs: [prepare]
    image: python:3.12-slim
    command: ["python", "-c", "print('Test B passed')"]
  report:
    needs: [test_a, test_b]
    image: alpine:3.20
    command: ["echo", "All done"]