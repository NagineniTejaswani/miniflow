[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
miniflow = "miniflow.cli:app"

[tool.setuptools]
packages = ["miniflow"]